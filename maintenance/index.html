  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0908;
      --panel: #0e0c0b;
      --ink: #f2efe9;
      --ink-2: #cfc9be;
      --muted: #a39d92;
      --accent: #ff5a1f;
      --line: rgba(242, 239, 233, 0.16);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f3efe6;
      --panel: #e7e1d6;
      --ink: #1c1915;
      --ink-2: #3a342c;
      --muted: #6d655c;
      --accent: #e24b12;
      --line: rgba(28, 25, 21, 0.16);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter Tight", "Noto Naskh Arabic", system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.5;
    }
    .site-header, .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
    }
    .site-footer { border-bottom: 0; border-top: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; color: inherit; text-decoration: none; }
    .brand img { width: 36px; height: 36px; object-fit: contain; }
    .brand span { font-family: "Instrument Serif", "Noto Naskh Arabic", serif; font-size: 28px; letter-spacing: -0.03em; white-space: nowrap; }
    .actions { display: flex; align-items: center; gap: 8px; }
    button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-height: 44px;
      min-width: 44px;
      padding: 0 12px;
      cursor: pointer;
    }
    button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
    main {
      min-height: calc(100dvh - 170px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 28px;
    }
    article { width: min(100%, 720px); }
    h1 {
      font-family: "Instrument Serif", "Noto Naskh Arabic", serif;
      font-size: clamp(48px, 8vw, 84px);
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    .message { margin-top: 24px; max-width: 540px; color: var(--ink-2); }
    .apology { margin-top: 12px; color: var(--muted); }
    .track { margin-top: 36px; height: 2px; background: var(--line); overflow: hidden; position: relative; }
    .track span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 32%;
      background: var(--accent);
      animation: slide 1.8s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
    .meta { color: var(--muted); font-size: 14px; text-align: end; }
    .meta a { color: var(--ink); }
    @media (max-width: 640px) {
      .site-header, .site-footer { align-items: flex-start; flex-direction: column; }
      .meta { text-align: start; }
    }
    @media (prefers-reduced-motion: reduce) { .track span { animation: none; width: 100%; } }
  </style>
</head>

  <script>
    (function () {
      var year = new Date().getFullYear();
      var T = {
        fr: { title: "Maintenance", desc: "Wayo Agency met le site à jour. Il revient dans quelques minutes.", apology: "Merci de patienter.", theme: "Clair", themeOn: "Sombre", page: "Maintenance — Wayo Agency" },
        en: { title: "Maintenance", desc: "Wayo Agency is updating the site. It will be back in a few minutes.", apology: "Thank you for waiting.", theme: "Light", themeOn: "Dark", page: "Maintenance — Wayo Agency" },
        ar: { title: "صيانة", desc: "Wayo Agency تحدّث الموقع. سيعود خلال دقائق.", apology: "شكراً لصبركم.", theme: "فاتح", themeOn: "داكن", page: "صيانة — Wayo Agency" }
      };
      function cookie(name) {
        var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
        return m ? decodeURIComponent(m[1]) : "";
      }
      function writeCookie(name, value) {
        document.cookie = name + "=" + value + "; Path=/; Max-Age=31536000; SameSite=Lax";
      }
      function themeLabel(lang, light) {
        var copy = T[lang] || T.fr;
        return light ? copy.themeOn : copy.theme;
      }
      function setTheme(value) {
        var light = value === "light";
        if (light) document.documentElement.setAttribute("data-theme", "light");
        else document.documentElement.removeAttribute("data-theme");
        writeCookie("theme", light ? "light" : "dark");
        var lang = document.documentElement.lang || "fr";
        var button = document.getElementById("theme");
        button.textContent = themeLabel(lang, light);
        button.setAttribute("aria-pressed", light ? "true" : "false");
      }
      function setLang(lang) {
        if (!T[lang]) lang = "fr";
        var copy = T[lang];
        var rtl = lang === "ar";
        document.documentElement.lang = lang;
        document.documentElement.dir = rtl ? "rtl" : "ltr";
        document.getElementById("title").textContent = copy.title;
        document.getElementById("desc").textContent = copy.desc;
        document.getElementById("apology").textContent = copy.apology;
        document.title = copy.page;
        document.getElementById("copyright").textContent = "© " + year + " Wayo Agency";
        var light = document.documentElement.getAttribute("data-theme") === "light";
        document.getElementById("theme").textContent = themeLabel(lang, light);
        document.querySelectorAll(".lang").forEach(function (button) {
          var on = button.getAttribute("data-lang") === lang;
          button.setAttribute("aria-pressed", on ? "true" : "false");
        });
        writeCookie("locale", lang);
      }
      var savedTheme = cookie("theme");
      setTheme(savedTheme === "light" ? "light" : "dark");
      var savedLang = cookie("locale");
      setLang(savedLang === "en" || savedLang === "ar" ? savedLang : "fr");
      document.getElementById("theme").addEventListener("click", function () {
        setTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
      });
      document.querySelectorAll(".lang").forEach(function (button) {
        button.addEventListener("click", function () { setLang(button.getAttribute("data-lang")); });
      });
      function watch() {
        if (document.hidden) return;
        fetch("/_wayo/live", { cache: "no-store", headers: { Accept: "text/plain" } }).then(function (response) {
          if (response.status !== 503) location.replace(location.pathname + location.search);
        }).catch(function () {});
      }
      setInterval(watch, 2000);
      document.addEventListener("visibilitychange", watch);
    })();
  </script>
</body>
</html>
