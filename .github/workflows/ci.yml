name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: wayo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d wayo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://user:pass@localhost:5432/wayo
      AUTH_SECRET: ci-secret-ci-secret-ci-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD_HASH: $argon2id$v=19$m=65536,t=3,p=4$Y2k$Y2k
      IP_HASH_SALT: ci-salt
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
